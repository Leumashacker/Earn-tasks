<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>Earn Tasks</title>
<style>
:root{--g:#16a34a;--gd:#15803d;--gl:#dcfce7;--p:#7c3aed;--pd:#6d28d9;--pl:#ede9fe;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f8fafc;--gold:#f59e0b;--red:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px}
button{font:inherit;cursor:pointer;border:0}
.top{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top.purple{background:var(--p)}
.top h1{font-size:18px;margin:0;flex:1}
.back{background:rgba(255,255,255,.2);color:#fff;border-radius:10px;width:34px;height:34px;font-size:18px}
.chip{background:#fff;color:var(--gd);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.wrap{padding:16px}
.hello{font-size:20px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.task{display:flex;gap:14px;align-items:center;width:100%;text-align:left;color:inherit}
.ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none;background:var(--gl)}
.t-purple .ico{background:var(--pl)}
.t-gold .ico{background:#fef3c7}
.task b{display:block;font-size:16px}
.task small{color:var(--mut)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--gl);color:var(--gd);margin-top:6px}
.t-purple .pill{background:var(--pl);color:var(--pd)}
.t-gold .pill{background:#fef3c7;color:#b45309}
.lvl{display:flex;align-items:center;gap:12px}
.lvl .n{width:44px;height:44px;border-radius:14px;background:var(--gl);color:var(--gd);font-weight:800;display:grid;place-items:center;flex:none}
.purple-theme .lvl .n{background:var(--pl);color:var(--pd)}
.lvl .info{flex:1}
.lvl .info b{display:block}
.lvl .info small{color:var(--mut)}
.btn{background:var(--g);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.purple-theme .btn.main{background:var(--p)}
.btn.lock{background:#f1f5f9;color:var(--mut)}
.btn.lock.can{background:#fff;color:var(--gd);border:2px solid var(--g)}
.purple-theme .btn.lock.can{color:var(--pd);border-color:var(--p)}
.btn.done{background:var(--gl);color:var(--gd)}
.btn.big{width:100%;padding:14px;font-size:16px;border-radius:14px}
.btn.alt{background:#fff;color:var(--gd);border:2px solid var(--g)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--g);transition:width .25s}
.purple-theme .prog i{background:var(--p)}
.qmeta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;font-weight:600}
.q{font-size:19px;font-weight:700;line-height:1.35;margin:18px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font-size:16px;color:var(--ink)}
.opt.sel{border-color:var(--g);background:var(--gl)}
.purple-theme .opt.sel{border-color:var(--p);background:var(--pl)}
.rates{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rates .opt{text-align:center;padding:12px 0;margin:0}
textarea,input{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--g)}
.hint{font-size:12px;color:var(--mut);margin:6px 0 0}
.center{text-align:center}
.big-emoji{font-size:64px;margin:6px 0}
.ok{color:var(--gd)}.bad{color:var(--red)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px 26px;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet p{margin:0 0 14px;color:var(--mut)}
.sheet .btn{margin-bottom:10px}
.err{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
#toast.show{opacity:1}
.wheelbox{position:relative;width:300px;height:300px;margin:8px auto 18px}
#wheel{width:100%;height:100%;transition:transform 4.6s cubic-bezier(.12,.7,.1,1)}
.ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--red);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}
.amt.plus{color:var(--gd);font-weight:700}.amt.minus{color:var(--red);font-weight:700}
.walletbig{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border-radius:20px;padding:22px;margin-bottom:14px}
.walletbig small{opacity:.85}
.walletbig b{display:block;font-size:34px;margin-top:4px}
.link{background:none;color:var(--gd);font-weight:700;padding:8px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:4}
.tabs button{flex:1;padding:12px 0;background:none;color:var(--mut);font-weight:700;font-size:13px}
.tabs button.on{color:var(--gd);box-shadow:inset 0 -3px 0 var(--g)}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:sp 0.8s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:15px}
.stats small{color:var(--mut);font-size:11px}
.walletbig .prog{background:rgba(255,255,255,.3);margin:14px 0 8px}
.walletbig .prog i{background:#fff}
.walletbig small{display:block}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;padding:8px 0 9px;color:var(--mut);font-size:11px;font-weight:700}
.nav button span{display:block;font-size:20px}
.nav button.on{color:var(--gd)}
.refbox{background:var(--gl);border:2px dashed var(--g);border-radius:14px;padding:12px;word-break:break-all;font-weight:700;color:var(--gd);margin:10px 0}
.field-label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:12px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL = 'https://pregccfvqsxhmtnkjncc.supabase.co';
const SB_KEY = 'sb_publishable_GGSCkyQ2xfm6cBDfg6cE_Q_5wqAQfi8';
if (!window.supabase) { document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">Could not load the app library. Check your internet connection and refresh.</p>'; throw new Error('supabase lib missing'); }
const sb = window.supabase.createClient(SB_URL, SB_KEY);

const TASKS = {
  surveys: { name: 'Surveys', icon: '📋', theme: '', desc: 'Share your opinion, earn cash' },
  brain:   { name: 'Brain Test', icon: '🧠', theme: 'purple', desc: 'Puzzles, riddles and IQ questions' },
  english: { name: 'Online Tutor: English', icon: '📖', theme: '', desc: 'Learn English and get paid' }
};
const SPIN_COST = 20;
const state = { user: null, balance: 0, dash: null };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => 'Ksh ' + Number(n || 0).toLocaleString('en-KE');
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) throw new Error(error.message);
  return data;
}
async function refreshBalance() {
  try { state.balance = Number(await rpc('ensure_wallet')); } catch (e) {}
  document.querySelectorAll('[data-bal]').forEach(el => el.textContent = money(state.balance));
  return state.balance;
}
function normPhone(p) {
  p = String(p || '').replace(/\D/g, '');
  if (/^0[17]\d{8}$/.test(p)) p = '254' + p.slice(1);
  if (/^[17]\d{8}$/.test(p)) p = '254' + p;
  return p;
}

/* ---------- helpers / layout ---------- */
function getRef() { try { return localStorage.getItem('ref') || ''; } catch (e) { return ''; } }
try { const r = new URLSearchParams(location.search).get('ref'); if (r) localStorage.setItem('ref', r.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12)); } catch (e) {}

function navBar(active) {
  const items = [['#/', '🏠', 'Tasks'], ['#/refer', '👥', 'Invite'], ['#/wallet', '💳', 'Wallet'], ['#/settings', '⚙️', 'Settings']];
  if (state.dash && state.dash.is_admin) items.push(['#/admin', '🛡️', 'Admin']);
  return `<div style="height:76px"></div><nav class="nav" id="nav" data-active="${active}">${items.map(([h, i, l]) =>
    `<button class="${h === active ? 'on' : ''}" onclick="location.hash='${h}'"><span>${i}</span>${l}</button>`).join('')}</nav>`;
}
function paintNav() {
  const n = $('#nav'); if (!n) return;
  const a = n.dataset.active; const sp = n.previousElementSibling;
  if (sp) sp.remove(); n.outerHTML = navBar(a);
}
function shell({ title, back, theme = '', body, bal = true, active = null }) {
  $('#app').className = theme === 'purple' ? 'purple-theme' : '';
  $('#app').innerHTML = `
    <div class="top ${theme}">
      ${back ? `<button class="back" onclick="location.hash='${back}'">‹</button>` : ''}
      <h1>${esc(title)}</h1>
      ${bal ? `<button class="chip" onclick="location.hash='#/wallet'" data-bal>${money(state.balance)}</button>` : ''}
    </div>
    ${body}${active ? navBar(active) : ''}`;
}
const loading = () => `<div class="spinner"></div>`;
async function loadDash() {
  try {
    state.dash = await rpc('get_dashboard');
    state.balance = Number(state.dash.balance);
    document.querySelectorAll('[data-bal]').forEach(el => el.textContent = money(state.balance));
    paintNav();
  } catch (e) { toast(e.message); }
  return state.dash;
}
function progressHtml(d) {
  const min = Number(d.min_withdrawal), bal = Number(d.balance), pct = Math.min(100, Math.round(bal / min * 100));
  return `<div class="prog"><i style="width:${pct}%"></i></div><small>${bal >= min ? 'You can withdraw now' : money(min - bal) + ' more to reach the ' + money(min) + ' withdrawal minimum'}</small>`;
}
function copyText(t) {
  const done = () => toast('Copied!');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => toast('Press and hold to copy'));
  else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Press and hold to copy'); } ta.remove(); }
}

/* ---------- auth ---------- */
function authView(mode = 'login') {
  const signup = mode === 'signup';
  const ref = getRef();
  $('#app').className = '';
  $('#app').innerHTML = `
    <div class="top"><h1>Earn Tasks</h1></div>
    <div class="wrap">
      <div class="center"><div class="big-emoji">💰</div>
        <div class="hello">${signup ? 'Create your account' : 'Welcome back'}</div>
        <p class="sub">${signup ? 'Sign up and get a welcome bonus in your wallet.' : 'Complete simple tasks and earn real cash to your wallet.'}</p></div>
      <div class="card">
        <div id="autherr"></div>
        ${signup && ref ? `<p class="hint" style="margin:0 0 8px">Invited with code <b>${esc(ref)}</b></p>` : ''}
        ${signup ? `<input id="un" placeholder="Username (letters, numbers, _)" autocomplete="username" autocapitalize="none" style="margin-bottom:10px">` : ''}
        <input id="em" type="email" placeholder="Email" autocomplete="email" style="margin-bottom:10px">
        <input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="${signup ? 'new-password' : 'current-password'}" style="margin-bottom:12px">
        <button class="btn big" id="authgo">${signup ? 'Sign up' : 'Log in'}</button>
        <div class="sep">or</div>
        <button class="btn alt big" id="google">Continue with Google</button>
        <div class="center" style="margin-top:8px"><button class="link" onclick="authView('${signup ? 'login' : 'signup'}')">${signup ? 'I already have an account' : 'Create a new account'}</button>
          ${signup ? '' : `<br><button class="link" onclick="forgotPw()">Forgot password?</button>`}</div>
      </div>
    </div>`;
  const show = (m, ok) => $('#autherr').innerHTML = `<div class="err" ${ok ? 'style="background:#dcfce7;color:#166534"' : ''}>${esc(m)}</div>`;
  const go = async () => {
    const email = $('#em').value.trim(), password = $('#pw').value;
    const username = signup ? $('#un').value.trim().toLowerCase() : '';
    if (signup && !/^[a-z0-9_]{3,20}$/.test(username)) return show('Username must be 3-20 characters: letters, numbers or _ only.');
    if (!email || password.length < 6) return show('Enter your email and a password of at least 6 characters.');
    $('#authgo').disabled = true; $('#authgo').textContent = 'Please wait…';
    try {
      if (signup) {
        const { data: free, error: ue } = await sb.rpc('username_available', { p: username });
        if (ue) throw ue;
        if (!free) { show('That username is taken. Pick another one.'); throw 'handled'; }
      }
      const { data, error } = signup
        ? await sb.auth.signUp({ email, password, options: { data: { username, ref } } })
        : await sb.auth.signInWithPassword({ email, password });
      if (error) {
        let m = error.message;
        if (/invalid login/i.test(m)) m = 'Wrong email or password. If you have no account yet, tap "Create a new account".';
        else if (/not confirmed/i.test(m)) m = 'Please confirm your email first (check your inbox and spam), then log in.';
        else if (/already registered/i.test(m)) m = 'This email already has an account. Tap "I already have an account" to log in.';
        else if (/rate limit/i.test(m)) m = 'Too many attempts. Wait a few minutes and try again.';
        show(m);
      } else if (signup && !data.session) {
        show('Account created. Check your email to confirm it, then log in.', true);
      }
    } catch (e) { if (e !== 'handled') show('Network error. Check your connection and try again.'); }
    $('#authgo').disabled = false; $('#authgo').textContent = signup ? 'Sign up' : 'Log in';
  };
  $('#authgo').onclick = go;
  $('#pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  $('#google').onclick = async () => {
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    if (error) show(/not enabled|unsupported/i.test(error.message) ? 'Google sign-in is not set up yet.' : error.message);
  };
}

/* ---------- home ---------- */
async function homeView() {
  shell({ title: 'Earn Tasks', active: '#/', body: `
    <div class="wrap">
      <div id="dash">${loading()}</div>
      <div class="hello" style="margin-top:6px">Pick a task</div>
      <p class="sub">Pass with 7 out of 10 to earn the reward.</p>
      <button class="card task" onclick="location.hash='#/task/surveys'"><div class="ico">📋</div><div><b>Surveys</b><small>${TASKS.surveys.desc}</small><br><span class="pill">Start free · earn up to Ksh 200</span></div></button>
      <div class="t-purple"><button class="card task" onclick="location.hash='#/task/brain'"><div class="ico">🧠</div><div><b>Brain Test</b><small>${TASKS.brain.desc}</small><br><span class="pill">Start free · earn up to Ksh 200</span></div></button></div>
      <div class="t-gold"><button class="card task" onclick="location.hash='#/spin'"><div class="ico">🎡</div><div><b>Spin the Wheel</b><small>${money(SPIN_COST)} per spin</small><br><span class="pill">Win up to Ksh 500</span></div></button></div>
      <button class="card task" onclick="location.hash='#/task/english'"><div class="ico">📖</div><div><b>Online Tutor: English</b><small>${TASKS.english.desc}</small><br><span class="pill">Start free · earn up to Ksh 200</span></div></button>
      <div id="payouts"></div>
    </div>` });
  const d = await loadDash();
  if (d && $('#dash')) {
    $('#dash').innerHTML = `
      <div class="hello">Hi, ${esc(d.username)} 👋</div>
      <div class="walletbig" style="margin-top:10px"><small>Wallet balance</small><b data-bal>${money(d.balance)}</b>${progressHtml(d)}</div>
      <div class="stats">
        <div><b>${money(d.total_earned)}</b><small>Total earned</small></div>
        <div><b>${d.referrals}</b><small>Referrals</small></div>
        <div><b>${money(d.total_withdrawn)}</b><small>Withdrawn</small></div>
      </div>`;
  } else if ($('#dash')) $('#dash').innerHTML = '';
  try {
    const w = await rpc('get_recent_withdrawals');
    if (w.length && $('#payouts')) $('#payouts').innerHTML = `<div class="card"><b>Recent payouts</b>${w.map(x =>
      `<div class="row"><span>${esc(x.name)}</span><span class="amt plus">${money(x.amount)}</span></div>`).join('')}</div>`;
  } catch (e) {}
}

/* ---------- levels ---------- */
async function levelsView(task) {
  const T = TASKS[task]; if (!T) return (location.hash = '#/');
  shell({ title: T.name, back: '#/', theme: T.theme, body: `<div class="wrap" id="lv">${loading()}</div>` });
  refreshBalance();
  try {
    const levels = await rpc('get_task_overview', { p_task: task });
    window._levels = levels;
    $('#lv').innerHTML = `<p class="sub">10 questions per level. Score 7 or more to earn the reward.</p>` + levels.map(l => {
      let btn, sub;
      if (l.completed) { btn = `<button class="btn done" disabled>Done ✓</button>`; sub = `Earned ${money(l.reward)}`; }
      else if (l.price == 0) { btn = `<button class="btn main" onclick="onLevel('${task}',${l.level})">Start Free</button>`; sub = `FREE · Reward ${money(l.reward)}`; }
      else if (l.unlocked) { btn = `<button class="btn main" onclick="onLevel('${task}',${l.level})">Start</button>`; sub = `Unlocked · Reward ${money(l.reward)}`; }
      else { btn = `<button class="btn lock ${l.can_unlock ? 'can' : ''}" onclick="onLevel('${task}',${l.level})">🔒 Pay ${money(l.price)}</button>`; sub = `Reward ${money(l.reward)}`; }
      return `<div class="card lvl"><div class="n">L${l.level}</div><div class="info"><b>Level ${l.level}</b><small>${sub}</small></div>${btn}</div>`;
    }).join('');
  } catch (e) { $('#lv').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function onLevel(task, n) {
  const l = (window._levels || []).find(x => x.level === n); if (!l) return;
  if (l.completed) return toast('You already completed this level');
  if (l.unlocked) return (location.hash = `#/quiz/${task}/${n}`);
  if (!l.can_unlock) return toast(`Complete Level ${n - 1} first`);
  payModal({
    title: `Unlock Level ${n}`,
    text: `Pay ${money(l.price)} to unlock this level and earn ${money(l.reward)} when you pass.`,
    amount: Number(l.price),
    run: (method) => rpc('unlock_level', { p_task: task, p_level: n, p_method: 'wallet', p_intent: null }),
    onDone: () => { toast('Level unlocked!'); location.hash = `#/quiz/${task}/${n}`; }
  });
}

/* ---------- payments ---------- */
function closeModal() { $('#modal').innerHTML = ''; }
function payModal({ title, text, amount, run, onDone }) {
  const enough = state.balance >= amount;
  $('#modal').innerHTML = `
    <div class="overlay" id="ov"><div class="sheet">
      <h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div id="perr"></div>
      <div id="pbody">
        <button class="btn big" id="pw" ${enough ? '' : 'disabled'}>Pay from Wallet Balance (${money(state.balance)})</button>
        ${enough ? '' : `<p class="hint" style="margin:-4px 0 10px">Your wallet balance is too low.</p>`}
        <button class="btn big alt" id="pm">Pay via M-Pesa</button>
        <button class="link" style="width:100%" id="pc">Cancel</button>
      </div>
    </div></div>`;
  const perr = (m) => $('#perr').innerHTML = m ? `<div class="err">${esc(m)}</div>` : '';
  const finish = async () => {
    const out = await run(); closeModal(); await refreshBalance(); onDone && onDone(out);
  };
  $('#pc').onclick = closeModal;
  $('#ov').onclick = (e) => { if (e.target.id === 'ov') closeModal(); };
  $('#pw').onclick = async () => {

    try { await finish(); } catch (e) { payModal({ title, text, amount, run, onDone }); $('#perr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  $('#pm').onclick = () => {
    $('#pbody').innerHTML = `
      <input id="ph" inputmode="tel" placeholder="M-Pesa number e.g. 0712345678">
      <p class="hint">We will send an STK push for ${money(amount)}. Enter your PIN on your phone.</p>
      <button class="btn big" id="go" style="margin-top:12px">Send M-Pesa request</button>
      <button class="link" style="width:100%" id="back2">Back</button>`;
    $('#back2').onclick = () => payModal({ title, text, amount, run, onDone });
    $('#go').onclick = async () => {
      const phone = normPhone($('#ph').value);
      if (!/^254(7|1)\d{8}$/.test(phone)) return perr('Enter a valid Safaricom number.');
      perr(''); $('#pbody').innerHTML = loading() + `<p class="center sub">Waiting for your M-Pesa payment…<br>Enter your PIN on your phone.</p>`;
      try {
        await stkAndWait(amount, phone);
        await finish();
      } catch (e) { payModal({ title, text, amount, run, onDone }); $('#perr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
  };
}
async function stkAndWait(amount, phone) {
  const before = await refreshBalance();
  const { data, error } = await sb.functions.invoke('mpesa-stk-push', { body: { amount, phone } });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch (_) {}
    throw new Error(m);
  }
  if (data && data.error) throw new Error(data.error);
  for (let i = 0; i < 40; i++) {            // wait up to ~2 minutes
    await sleep(3000);
    const b = await refreshBalance();
    if (b >= before + amount) return b;
  }
  throw new Error('We did not receive your M-Pesa payment yet. If money was deducted it will appear in your wallet shortly.');
}

/* ---------- quiz ---------- */
let Q = null;
async function quizView(task, level) {
  const T = TASKS[task]; if (!T) return (location.hash = '#/');
  shell({ title: `${T.name} · Level ${level}`, back: `#/task/${task}`, theme: T.theme, body: `<div class="wrap" id="qb">${loading()}</div>` });
  try {
    const qs = await rpc('get_level_questions', { p_task: task, p_level: level });
    const lv = (await rpc('get_task_overview', { p_task: task })).find(x => x.level === level);
    if (!qs.length) throw new Error('No questions for this level yet.');
    Q = { task, level, qs, i: 0, ans: [], reward: lv ? lv.reward : 0 };
    renderQ();
  } catch (e) { $('#qb').innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn big" onclick="location.hash='#/task/${task}'">Back to levels</button>`; }
}
function wordCount(s) { return String(s || '').trim().split(/\s+/).filter(Boolean).length; }
function renderQ() {
  const { qs, i } = Q, q = qs[i], total = qs.length;
  const isText = q.type === 'text', isRate = !isText && q.options.length === 10;
  const cur = Q.ans[i];
  let inner;
  if (isText) inner = `<textarea id="txt" placeholder="Type your answer here…">${esc(cur || '')}</textarea><p class="hint" id="wc"></p>`;
  else {
    const btns = q.options.map((o, k) => `<button class="opt ${cur === k ? 'sel' : ''}" onclick="pick(${k})">${esc(o)}</button>`).join('');
    inner = isRate ? `<div class="rates">${btns}</div>` : btns;
  }
  $('#qb').innerHTML = `
    <div class="qmeta"><span>Question ${i + 1}/${total}</span><span>Reward ${money(Q.reward)}</span></div>
    <div class="prog"><i style="width:${(i / total) * 100}%"></i></div>
    <div class="q">${esc(q.q)}</div>
    ${inner}
    <button class="btn main big" id="nx" style="margin-top:14px" disabled>${i === total - 1 ? 'Finish' : 'Next'}</button>`;
  const nx = $('#nx');
  nx.onclick = next;
  if (isText) {
    const t = $('#txt'), min = q.min_words || 1;
    const upd = () => { Q.ans[i] = t.value; const w = wordCount(t.value); $('#wc').textContent = `${w} / ${min} words minimum`; nx.disabled = w < min; };
    t.oninput = upd; upd();
  } else nx.disabled = cur === undefined;
}
function pick(k) { Q.ans[Q.i] = k; renderQ(); }
async function next() {
  if (Q.i < Q.qs.length - 1) { Q.i++; return renderQ(); }
  $('#qb').innerHTML = loading();
  try {
    const r = await rpc('submit_quiz', { p_task: Q.task, p_level: Q.level, p_answers: Q.ans });
    await refreshBalance();
    const T = TASKS[Q.task];
    $('#qb').innerHTML = `<div class="card center">
      <div class="big-emoji">${r.passed ? '🎉' : '😕'}</div>
      <div class="hello ${r.passed ? 'ok' : 'bad'}">${r.passed ? 'You passed!' : 'Not this time'}</div>
      <p class="sub">You scored <b>${r.score}/${r.total}</b>. ${r.passed ? `${money(r.reward)} was added to your wallet.` : 'You need at least 7 to earn the reward. Try again in a minute.'}</p>
      <button class="btn main big" onclick="location.hash='#/task/${Q.task}'">${r.passed ? 'Next level' : 'Back to levels'}</button>
      ${r.passed ? '' : `<button class="btn alt big" style="margin-top:10px" onclick="quizView('${Q.task}',${Q.level})">Try again</button>`}
    </div>`;
  } catch (e) {
    $('#qb').innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn big" onclick="renderQ()">Back to questions</button>`;
  }
}

/* ---------- spin ---------- */
let rot = 0, spinning = false, SEGS = [];
async function spinView() {
  shell({ title: 'Spin the Wheel', back: '#/', body: `<div class="wrap" id="sp">${loading()}</div>` });
  refreshBalance();
  const { data, error } = await sb.from('spin_segments').select('*').order('sort_order');
  if (error) return $('#sp').innerHTML = `<div class="err">${esc(error.message)}</div>`;
  SEGS = data;
  const n = SEGS.length, step = 360 / n, R = 96;
  const pt = (a) => [R * Math.sin(a * Math.PI / 180), -R * Math.cos(a * Math.PI / 180)];
  const cols = ['#16a34a', '#22c55e', '#15803d', '#4ade80', '#166534', '#9ca3af', '#f59e0b'];
  const paths = SEGS.map((s, i) => {
    const [x0, y0] = pt(i * step), [x1, y1] = pt((i + 1) * step), mid = (i + .5) * step;
    const fill = s.is_jackpot ? '#f59e0b' : (Number(s.prize) === 0 ? '#9ca3af' : cols[i % 5]);
    return `<path d="M0 0 L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} Z" fill="${fill}" stroke="#fff" stroke-width="1.5"/>
      <text transform="rotate(${mid - 90}) translate(88,0)" text-anchor="end" dominant-baseline="middle" font-size="8.5" font-weight="700" fill="#fff">${esc(s.label)}</text>`;
  }).join('');
  $('#sp').innerHTML = `
    <div class="wheelbox"><div class="ptr"></div>
      <div id="wheel"><svg viewBox="-100 -100 200 200" width="100%" height="100%"><circle r="99" fill="#fff"/>${paths}<circle r="9" fill="#fff" stroke="#16a34a" stroke-width="3"/></svg></div></div>
    <button class="btn big" id="spinbtn" style="background:var(--gold)">Pay ${money(SPIN_COST)} to Spin</button>
    <p class="hint center">Prize goes straight to your wallet.</p>
    <div class="card" style="margin-top:14px"><b>Recent spins</b><div id="hist">${loading()}</div></div>`;
  $('#spinbtn').onclick = startSpin;
  loadSpinHistory();
}
async function loadSpinHistory() {
  const { data } = await sb.from('spin_history').select('segment_label,prize,created_at').order('created_at', { ascending: false }).limit(6);
  const el = $('#hist'); if (!el) return;
  el.innerHTML = (data && data.length) ? data.map(h => `<div class="row"><span>${esc(h.segment_label)}</span><span class="amt ${h.prize > 0 ? 'plus' : ''}">${h.prize > 0 ? '+' + money(h.prize) : 'No win'}</span></div>`).join('') : `<p class="hint">No spins yet.</p>`;
}
function startSpin() {
  if (spinning) return;
  payModal({
    title: 'Pay Ksh 20 to spin', text: 'Choose how to pay for this spin.', amount: SPIN_COST,
    run: () => rpc('spin_wheel', { p_method: 'wallet', p_intent: null }),
    onDone: animateSpin
  });
}
async function animateSpin(r) {
  spinning = true; $('#spinbtn').disabled = true;
  const step = 360 / SEGS.length, mid = (r.sort_order - 0.5) * step;
  const cur = ((rot % 360) + 360) % 360;
  rot += 360 * 6 + ((360 - mid - cur) % 360 + 360) % 360;
  $('#wheel').style.transform = `rotate(${rot}deg)`;
  await sleep(4800);
  spinning = false; $('#spinbtn').disabled = false;
  document.querySelectorAll('[data-bal]').forEach(el => el.textContent = money(r.balance));
  state.balance = Number(r.balance);
  $('#modal').innerHTML = `<div class="overlay" id="ov"><div class="sheet center">
    <div class="big-emoji">${r.jackpot ? '🏆' : r.prize > 0 ? '🎉' : '🔁'}</div>
    <h3>${r.jackpot ? 'JACKPOT!' : r.prize > 0 ? 'You won ' + money(r.prize) : 'Try again'}</h3>
    <p>${r.prize > 0 ? 'Added to your wallet.' : 'No prize this time. Better luck on the next spin.'}</p>
    <button class="btn big" onclick="closeModal()">OK</button></div></div>`;
  loadSpinHistory();
}

  if (p[0] === 'quiz') return quizView(p[1], Number(p[2]));
  if (p[0] === 'spin') return spinView();
  if (p[0] === 'wallet') return walletView();
  if (p[0] === 'refer') return referView();
  if (p[0] === 'settings') return settingsView();
  if (p[0] === 'admin') return adminView();
  homeView();
}
window.addEventListener('hashchange', route);
async function forgotPw() {
  const email = ($('#em') && $('#em').value || '').trim();
  const show = (m, ok) => $('#autherr').innerHTML = `<div class="err" ${ok ? 'style="background:#dcfce7;color:#166534"' : ''}>${esc(m)}</div>`;
  if (!email) return show('Type your email above first, then tap Forgot password.');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) return show(/rate limit/i.test(error.message) ? 'Too many emails sent. Wait an hour and try again.' : error.message);
  show('If this email has an account, a reset link has been sent. Check your inbox and spam.', true);
}
function recoveryView() {
  $('#app').className = '';
  $('#app').innerHTML = `<div class="top"><h1>Set new password</h1></div>
    <div class="wrap"><div class="card"><div id="rerr"></div>
      <input id="np" type="password" placeholder="New password (min 6 characters)" autocomplete="new-password" style="margin-bottom:12px">
      <button class="btn big" id="rgo">Save new password</button></div></div>`;
  $('#rgo').onclick = async () => {
    const pw = $('#np').value;
    if (pw.length < 6) return $('#rerr').innerHTML = '<div class="err">Use at least 6 characters.</div>';
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) return $('#rerr').innerHTML = `<div class="err">${esc(error.message)}</div>`;
    recovering = false; location.hash = '#/'; route();
  };
}
let recovering = false;
sb.auth.onAuthStateChange((_e, session) => {
  if (_e === 'PASSWORD_RECOVERY') { recovering = true; state.user = session ? session.user : null; return recoveryView(); }
  if (recovering) return;
  const was = state.user && state.user.id;
  state.user = session ? session.user : null;
  if ((state.user && state.user.id) !== was) { state.dash = null; if (!state.user) location.hash = '#/'; route(); }
});
sb.auth.getSession().then(({ data }) => { state.user = data.session ? data.session.user : null; if (!recovering) route(); });
</script>
